services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: foodtruckpos
      POSTGRES_USER: foodtruck
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_strong_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodtruck -d foodtruckpos"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://foodtruck:${POSTGRES_PASSWORD:-change_me_strong_password}@postgres:5432/foodtruckpos
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"

  receipts:
    build:
      context: ../server/chaslay-receipts
    restart: unless-stopped
    env_file:
      - ../server/chaslay-receipts/.env
    environment:
      RECEIPTS_DATA_DIR: /data/receipts
    volumes:
      - receipts_data:/data/receipts
    ports:
      - "8080:8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - receipts

volumes:
  postgres_data:
  receipts_data:
  caddy_data:
  caddy_config:
