<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chaslay — Order online</title>
  <style>
    :root { --brand: #00897B; }
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 0 auto; padding: 16px; color: #222; }
    h1 { margin-bottom: 4px; }
    .muted { color: #666; margin-top: 0; }
    .item { border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    button { background: var(--brand); color: #fff; border: 0; padding: 10px 16px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
    button.secondary { background: #455a64; }
    input, textarea { width: 100%; padding: 8px; margin: 6px 0 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
    #cart { margin: 16px 0; padding: 12px; background: #f5f5f5; border-radius: 8px; }
    .error { color: #c62828; }
    .success { color: var(--brand); font-weight: 600; }
  </style>
</head>
<body>
  <h1 id="shopName">Loading…</h1>
  <p class="muted" id="shopSubtitle"></p>
  <div id="menu"></div>
  <div id="cart" hidden>
    <strong>Your order</strong>
    <ul id="cartList"></ul>
    <p id="cartTotal"></p>
  </div>
  <hr />
  <h2>Checkout</h2>
  <label>Name <input id="name" autocomplete="name" /></label>
  <label>Phone <input id="phone" autocomplete="tel" /></label>
  <label>Notes <textarea id="notes" rows="2"></textarea></label>
  <button id="submit" disabled>Place order</button>
  <p id="status"></p>
  <script>
    const cart = [];
    const slug = window.location.pathname.split('/').filter(Boolean)[0];
    let currency = 'CHF';
    let tenantName = slug;

    function renderCart() {
      const cartEl = document.getElementById('cart');
      const list = document.getElementById('cartList');
      const totalEl = document.getElementById('cartTotal');
      list.innerHTML = '';
      let total = 0;
      cart.forEach((item, index) => {
        total += item.lineTotal;
        const li = document.createElement('li');
        li.textContent = `${item.quantity}× ${item.name} — ${currency} ${item.lineTotal.toFixed(2)}`;
        list.appendChild(li);
      });
      cartEl.hidden = cart.length === 0;
      totalEl.textContent = cart.length ? `Total: ${currency} ${total.toFixed(2)}` : '';
      document.getElementById('submit').disabled = cart.length === 0;
    }

    async function loadMenu() {
      if (!slug) throw new Error('Missing shop name in URL');
      const res = await fetch(`/v1/shop/${encodeURIComponent(slug)}/menu`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Could not load menu');

      tenantName = data.tenant?.name || slug;
      currency = data.tenant?.currencySymbol || 'CHF';
      document.getElementById('shopName').textContent = tenantName;
      document.getElementById('shopSubtitle').textContent = `Order online · shop.chaslay.com/${slug}`;
      document.title = `${tenantName} — Order online`;

      const root = document.getElementById('menu');
      root.innerHTML = '';
      if (!data.products?.length) {
        root.innerHTML = '<p class="muted">No items available right now.</p>';
        return;
      }
      data.products.forEach(p => {
        const div = document.createElement('div');
        div.className = 'item';
        const info = document.createElement('div');
        info.innerHTML = `<strong>${p.name}</strong><br/><span class="muted">${currency} ${Number(p.price).toFixed(2)}</span>`;
        const btn = document.createElement('button');
        btn.textContent = 'Add';
        btn.onclick = () => {
          cart.push({ name: p.name, quantity: 1, unitPrice: p.price, lineTotal: p.price });
          renderCart();
        };
        div.appendChild(info);
        div.appendChild(btn);
        root.appendChild(div);
      });
    }

    document.getElementById('submit').onclick = async () => {
      const status = document.getElementById('status');
      status.className = '';
      status.textContent = 'Sending order…';
      const subtotal = cart.reduce((s, i) => s + i.lineTotal, 0);
      const body = {
        customerName: document.getElementById('name').value,
        customerPhone: document.getElementById('phone').value,
        notes: document.getElementById('notes').value,
        items: cart,
        subtotal,
        taxTotal: 0,
        total: subtotal,
        fulfillmentType: 'PICKUP'
      };
      const res = await fetch(`/v1/shop/${encodeURIComponent(slug)}/orders`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (res.ok) {
        status.className = 'success';
        status.textContent = `Order placed: ${data.orderNumber}. Thank you!`;
        cart.length = 0;
        renderCart();
      } else {
        status.className = 'error';
        status.textContent = data.error || 'Order failed';
      }
    };

    loadMenu().catch(e => {
      document.getElementById('shopName').textContent = 'Shop not found';
      document.getElementById('status').className = 'error';
      document.getElementById('status').textContent = e.message;
    });
  </script>
</body>
</html>
