<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Order online</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 0 auto; padding: 16px; }
    .item { border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    button { background: #00897B; color: #fff; border: 0; padding: 10px 16px; border-radius: 8px; cursor: pointer; }
    input, textarea { width: 100%; padding: 8px; margin: 6px 0 12px; box-sizing: border-box; }
  </style>
</head>
<body>
  <h1>Order online</h1>
  <p>Demo shop — connects to the same menu API as your POS.</p>
  <div id="menu"></div>
  <hr />
  <h2>Checkout</h2>
  <label>Name <input id="name" /></label>
  <label>Phone <input id="phone" /></label>
  <label>Notes <textarea id="notes"></textarea></label>
  <button id="submit">Place order</button>
  <p id="status"></p>
  <script>
    const cart = [];
    async function loadMenu() {
      const res = await fetch('/v1/orders/menu');
      const data = await res.json();
      const root = document.getElementById('menu');
      root.innerHTML = '';
      data.products.forEach(p => {
        const div = document.createElement('div');
        div.className = 'item';
        div.innerHTML = `<div><strong>${p.name}</strong><br/>CHF ${p.price.toFixed(2)}</div>`;
        const btn = document.createElement('button');
        btn.textContent = 'Add';
        btn.onclick = () => cart.push({ name: p.name, quantity: 1, unitPrice: p.price, lineTotal: p.price });
        div.appendChild(btn);
        root.appendChild(div);
      });
    }
    document.getElementById('submit').onclick = async () => {
      const subtotal = cart.reduce((s, i) => s + i.lineTotal, 0);
      const body = {
        customerName: document.getElementById('name').value,
        customerPhone: document.getElementById('phone').value,
        notes: document.getElementById('notes').value,
        items: cart,
        subtotal,
        taxTotal: 0,
        total: subtotal,
        fulfillmentType: 'PICKUP'
      };
      const res = await fetch('/v1/orders', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const data = await res.json();
      document.getElementById('status').textContent = res.ok ? `Order placed: ${data.orderNumber}` : (data.error || 'Failed');
      if (res.ok) cart.length = 0;
    };
    loadMenu().catch(e => document.getElementById('status').textContent = e.message);
  </script>
</body>
</html>
