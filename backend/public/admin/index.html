<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chaslay Admin</title>
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
  <div id="loginView" class="login-wrap">
    <div class="card">
      <h1>Chaslay Admin</h1>
      <p>Merchants manage menu & orders. Platform admin manages tenants & licenses.</p>
      <div class="login-tabs row">
        <button class="btn secondary small active" data-login-mode="merchant">Merchant login</button>
        <button class="btn secondary small" data-login-mode="superadmin">Platform admin</button>
      </div>
      <div id="merchantLoginFields">
        <label>Email<input id="loginEmail" type="email" autocomplete="username" /></label>
        <label>Password<input id="loginPassword" type="password" autocomplete="current-password" /></label>
      </div>
      <div id="superadminLoginFields" class="hidden">
        <label>Platform admin password<input id="superadminPassword" type="password" autocomplete="current-password" /></label>
      </div>
      <button class="btn" id="loginBtn" style="width:100%;margin-top:8px">Sign in</button>
      <div id="loginMsg" class="msg hidden"></div>
    </div>
  </div>

  <div id="appView" class="layout hidden">
    <aside class="sidebar">
      <div class="brand" id="sidebarBrand">Chaslay</div>
      <div id="sidebarNav"></div>
      <button class="btn nav-btn secondary" id="logoutBtn" style="margin-top:24px">Log out</button>
    </aside>
    <main class="main">
      <div class="topbar">
        <div>
          <h2 id="viewTitle">Dashboard</h2>
          <p class="muted" id="viewSubtitle"></p>
        </div>
        <span class="pill ok" id="roleBadge"></span>
      </div>
      <div id="appContent"></div>
    </main>
  </div>

  <div id="tenantModal" class="modal-backdrop hidden">
    <div class="modal">
      <div class="row" style="justify-content:space-between;margin-bottom:12px">
        <h2 id="modalTitle">Tenant</h2>
        <button class="btn secondary small" id="closeModalBtn">Close</button>
      </div>
      <div id="tenantDetail"></div>
    </div>
  </div>

  <script src="/admin/app.js"></script>
</body>
</html>
